[package]
name = "blackline"
version = "2.0.0"
edition = "2021"
rust-version = "1.76"
description = "A screenwriting studio — markdown in, industry format out."
license = "MIT"
authors = ["NativeCompute"]
homepage = "https://nativecompute.net"
repository = "https://github.com/NativeCompute/blackline"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
dirs = "5"
printpdf = { path = "vendor/printpdf", version = "0.7.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
web-time = "1.1"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
