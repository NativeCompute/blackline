name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          name="blackline-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "$name/packaging"
          cp target/release/blackline install.sh README.md LICENSE "$name/"
          cp packaging/blackline.desktop packaging/blackline.svg "$name/packaging/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: blackline-*.tar.gz

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "blackline-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/blackline.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: blackline-*.zip

  macos:
    name: macOS build (universal)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build, sign and zip Blackline.app
        run: packaging/macos/bundle.sh --out dist
      - name: Package
        run: |
          cd dist
          name="blackline-${GITHUB_REF_NAME}-macos-universal.zip"
          cp blackline-macos.zip "$name"
          shasum -a 256 "$name" > "$name.sha256"
          cp ../install-macos.sh .
          shasum -a 256 -c blackline-macos.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/blackline-*.zip
            dist/blackline-*.zip.sha256
            dist/install-macos.sh

  macos-intel:
    name: macOS tests on Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release

  macos-verify:
    name: macOS ${{ matrix.os }} — install the release on a fresh Mac
    needs: macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - name: Install, open, update and uninstall
        timeout-minutes: 15
        run: /bin/bash packaging/macos/verify-install.sh dist

  publish:
    name: GitHub Release
    needs: [linux, windows, macos, macos-intel, macos-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            blackline-*.tar.gz
            blackline-*.zip
            blackline-*.zip.sha256
            install-macos.sh
          generate_release_notes: true
