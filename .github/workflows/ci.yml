name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux — tests, clippy, browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: The library builds for the browser
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: The install scripts pass shellcheck
        run: shellcheck -S warning install.sh install-macos.sh packaging/macos/*.sh

  windows:
    name: Windows — build and clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --release

  macos:
    name: macOS ${{ matrix.os }} — tests and clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Run the real app with Metal
        timeout-minutes: 5
        run: ./target/release/blackline --smoke "$RUNNER_TEMP/smoke-wgpu" --renderer wgpu
      - name: Run the real app with OpenGL
        timeout-minutes: 5
        run: ./target/release/blackline --smoke "$RUNNER_TEMP/smoke-glow" --renderer glow
      - name: What the app saw
        if: always()
        run: cat "$RUNNER_TEMP"/smoke-*/report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/smoke-*/report.txt
            ${{ runner.temp }}/smoke-*/shots/

  linux-smoke:
    name: Linux — the real app under a virtual display
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libxkbcommon-x11-0
      - name: Build
        run: cargo build --release
      - name: Run the real app
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1400x1000x24" ./target/release/blackline --smoke "$RUNNER_TEMP/smoke"
      - name: What the app saw
        if: always()
        run: cat "$RUNNER_TEMP"/smoke/report.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: |
            ${{ runner.temp }}/smoke/report.txt
            ${{ runner.temp }}/smoke/shots/

  macos-app:
    name: macOS — the universal app, packed as released
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build, sign and zip Blackline.app
        run: packaging/macos/bundle.sh --out dist
      - name: Stage the release files
        run: cp install-macos.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/blackline-macos.zip
            dist/blackline-macos.zip.sha256
            dist/install-macos.sh
      - name: A contributor's ./install.sh builds and installs from source
        env:
          BLACKLINE_APP_DIR: ${{ runner.temp }}/from-source
          BLACKLINE_NO_OPEN: "1"
        run: |
          /bin/bash ./install.sh
          "$BLACKLINE_APP_DIR/Blackline.app/Contents/MacOS/blackline" --version
          codesign --verify --deep --strict "$BLACKLINE_APP_DIR/Blackline.app"

  macos-install:
    name: macOS ${{ matrix.os }} — install, open, update, uninstall
    needs: macos-app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: dist
      - name: Install it the way a user would and run it through macOS
        timeout-minutes: 15
        run: /bin/bash packaging/macos/verify-install.sh dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/blackline-verify/*/report.txt
            ${{ runner.temp }}/blackline-verify/*/shots/
            ${{ runner.temp }}/blackline-verify/*.log
            ${{ runner.temp }}/blackline-verify/*.err
